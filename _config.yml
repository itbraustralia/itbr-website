title: IT.BR Australia # your site title
author: IT.BR Australia
email: admin@itbr.com.au # email for form submission, you also have to change it in _js/scripts.js
description: > # this means to ignore newlines until "baseurl:"
  Site da comunidade de brasileiros que trabalham com IT na Australia
baseurl: "" # leave empty if hosting at root of username.github.io
url: "https://itbr.com.au" # the base hostname & protocol for your site
github_username: itbraustralia
social:
  name: IT.BR Australia
  links:
    - https://www.facebook.com/itbraustralia
    - https://github.com/itbraustralia

service_worker: true
google_tag_manager: 'UA-119467002-1'

# Build settings
markdown: kramdown
highlighter: rouge

# No theme gem needed — layouts/_includes/_sass are all in this repo
exclude:
  - README.md
  - node_modules
  - script
  - package.json
  - package-lock.json
  - Gemfile.lock
  - vendor
  - npm-debug.log
  - gulpfile.js
  - sleek.png
  - sleek.jpg
  - docker-compose.yml
  - jekyll-sleek.gemspec
  - LICENSE.txt

include: ['_pages']
permalink: /:title/

compress_html:
  clippings: all

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
